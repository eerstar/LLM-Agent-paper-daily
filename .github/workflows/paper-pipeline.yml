name: Paper Pipeline
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    concurrency:
      group: paper-catalog-main
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ENABLE_MILESTONE_ISSUES: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Run bounded pipeline
        id: pipeline
        env:
          PIPELINE_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run-logs
          case "$PIPELINE_MODE" in
            daily)
              python -m scripts.harvest --max-seconds 900 2>&1 | tee run-logs/harvest.log
              python -m scripts.stats_panel 2>&1 | tee run-logs/stats.log
              ;;
            links)
              python -m scripts.enrich_links --max-papers 40 --max-seconds 600 2>&1 | tee run-logs/links.log
              ;;
            backfill)
              python -m scripts.harvest --backfill --start-date 2026-05-15 --end-date 2026-10-20 --max-papers 1000 --max-seconds 600 2>&1 | tee run-logs/backfill.log
              ;;
            weekly)
              python -m scripts.weekly_report --mode weekly 2>&1 | tee run-logs/weekly.log
              ;;
            *) echo "Invalid pipeline mode: $PIPELINE_MODE"; exit 2 ;;
          esac
      - name: Save completed progress
        if: ${{ always() && steps.pipeline.outcome != 'skipped' }}
        env:
          PIPELINE_MODE: ${{ inputs.mode }}
        run: bash scripts/commit_outputs.sh
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pipeline-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-logs/
            docs/llm-agent-arxiv-daily.json
            docs/llm-agent-arxiv-daily-web.json
            reports/
            .cache/harvest.json
            .cache/backfill.json
            .cache/link-enrichment.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Surface failure
        if: failure()
        run: |
          echo "::error::Paper pipeline failed. Saved partial progress and diagnostics; inspect failed topics before retrying."
          echo "## Pipeline failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Completed progress was preserved. See the failed step and diagnostic artifact." >> "$GITHUB_STEP_SUMMARY"

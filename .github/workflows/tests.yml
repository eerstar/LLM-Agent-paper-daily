name: Tests
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "scripts/**"
      - "tests/**"
      - "requirements*"
      - "config.yaml"
      - ".github/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q daily_arxiv.py scripts tests
      - run: bash -n scripts/commit_outputs.sh
